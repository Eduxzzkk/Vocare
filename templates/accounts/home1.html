<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modal de login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <style>
    /* ===== Variáveis e base ===== */
    :root {
      --blue-950: #172554;
      --blue-900: #1e3a8a;
      --blue-800: #1e40af;
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-400: #6d8fd6;
      --blue-300: #93c5fd;
      --blue-200: #bfdbfe;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;

      /* Ajustes da imagem (1 = original): brilho menor = mais escura; saturação menor = cores mais suaves */
      --image-brightness: 0.68;
      --image-saturation: 0.8;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", ui-sans-serif, system-ui, sans-serif;
      color: var(--blue-900);
      background: var(--blue-50);
      -webkit-font-smoothing: antialiased;
    }

    h1, p { margin: 0; }
    button, input { font: inherit; }
    .is-hidden { display: none; }
    .no-scroll { overflow: hidden; }

    /* ===== Página de demonstração ===== */
    .demo {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .btn-primary {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 0;
      border-radius: 0.5rem;
      background: #11114e;
      color: #fff;
      font-weight: 400;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(29, 78, 216, 0.25);
      transition: filter 0.2s;
    }
    .btn-primary:hover { filter: brightness(0.9); }
    .btn-primary:focus-visible { outline: 0; box-shadow: 0 0 0 4px var(--blue-300); }

    .demo .btn-primary { width: auto; padding: 0.75rem 2rem; border-radius: 999px; }

    /* Botão "Entrar" do formulário (dentro do modal) */
    .form .btn-primary {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      border-radius: 0.375rem;
      background: linear-gradient(135deg, var(--blue-900), #11114e);
      box-shadow: 0 10px 15px -3px rgba(17, 17, 78, 0.3);
    }

    /* ===== Modal ===== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .modal[data-open="true"] { visibility: visible; opacity: 1; }

    .modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(23, 37, 84, 0.5);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }

    .modal__scroll { position: relative; height: 100%; overflow-y: auto; }

    .modal__center {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal__card {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      width: 100%;
      max-width: 60rem;
      padding: 0;
      overflow: hidden;
      background: #fff;
      border-radius: 0.25rem;
      box-shadow: 0 25px 50px -12px rgba(23, 37, 84, 0.3);
      transform: scale(0.95) translateY(0.75rem);
      transition: transform 0.3s;
    }
    .modal[data-open="true"] .modal__card { transform: none; }

    /* Painel da imagem */
    .modal__media {
      position: relative;
      height: 9rem;
      overflow: hidden;
    }
    .modal__media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 54%;
      filter: brightness(var(--image-brightness)) saturate(var(--image-saturation));
    }
    /* Painel do formulário */
    .modal__panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem 1.25rem 2rem;
    }

    .modal__close {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 2.5rem;
      height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--blue-400);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .modal__close:hover { background: var(--blue-50); color: var(--blue-700); }
    .modal__close:focus-visible { outline: 0; box-shadow: 0 0 0 4px var(--blue-200); }

    .modal__header { margin: 0.5rem 0 2rem; text-align: center; }
    .modal__title {
      margin-bottom: 0;
      font-size: 1.875rem;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-wrap: balance;
      color: #11114e;
    }
    /* Logotipo "Vocare" logo abaixo do título, centralizado (acompanha a fonte, em) */
    .modal__logo {
      display: block;
      height: 1.3em;
      width: auto;
      margin: 0.1em auto 0;
    }

    .form__signup { text-align: center; color: var(--blue-800); font-size: 0.9375rem; }

    .link {
      color: var(--blue-600);
      font-weight: 600;
      text-decoration: none;
      font-family: "Inter", sans-serif;
      margin-bottom: -10px;
    }
    .link:hover { color: var(--blue-800); text-decoration: underline; }
    .link:focus-visible { outline: 0; text-decoration: underline; }

    /* Formulário */
    .form { display: flex; flex-direction: column; gap: 1.25rem; }

    .field + .field { margin-top: 0.25rem; }

    .field__label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--blue-900);
    }

    .field__input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--blue-200);
      border-radius: 0.375rem;
      background: #fff;
      color: var(--blue-950);
      outline: 0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field__input::placeholder { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; color: var(--blue-400); }
    .field__input:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px var(--blue-100);
    }

    .field__wrap { position: relative; }
    .field__wrap .field__input { padding-right: 3rem; }

    .field__toggle {
      position: absolute;
      top: 50%;
      right: 0.625rem;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--blue-400);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .field__toggle:hover { background: var(--blue-50); color: var(--blue-700); }
    .field__toggle:focus-visible { outline: 0; box-shadow: 0 0 0 2px var(--blue-300); }

    .form__row {
      margin-top: 1.5rem; /* espaço extra abaixo do campo de senha */
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    .form__row .link { font-size: 0.875rem; }

    .icon { width: 1.25rem; height: 1.25rem; }

    /* ===== Telas maiores: imagem à esquerda ===== */
    @media (min-width: 768px) {
      .modal__card { grid-template-columns: 1fr 1fr; }
      .modal__media { height: auto; min-height: 37rem; }
      .modal__media img { object-position: 50% 40%; }
      .modal__panel { padding: 3rem 2.75rem; }
      .modal__close { top: 0.75rem; right: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .modal, .modal__card { transition: none; }
    }
  </style>
</head>

<body>

    <button id="open-login" type="button" class="btn-primary">Comece a sua jornada</button>

                  <button id="toggle-password" type="button" class="field__toggle" aria-label="Mostrar senha">
                    <svg id="icon-eye" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg id="icon-eye-off" class="icon is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                      <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                      <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                      <path d="m2 2 20 20" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Esqueceu a senha -->
              <div class="form__row">
                <a href="#recuperar-senha" class="link">Esqueceu a senha?</a>
              </div>

              <!-- Enviar -->
              <button type="submit" class="btn-primary">Continuar</button>

              <!-- Cadastro -->
              <p class="form__signup">
                Não tem uma conta?
                <a href="#cadastro" class="link">Cadastre-se</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const modal = document.getElementById('login-modal')
      const card = modal.querySelector('.modal__card')
      const openBtn = document.getElementById('open-login')
      const form = document.getElementById('login-form')
      const emailInput = document.getElementById('email')
      const passwordInput = document.getElementById('password')
      const toggleBtn = document.getElementById('toggle-password')
      const iconEye = document.getElementById('icon-eye')
      const iconEyeOff = document.getElementById('icon-eye-off')

      let lastFocused = null

      function openModal() {
        lastFocused = document.activeElement
        modal.dataset.open = 'true'
        modal.setAttribute('aria-hidden', 'false')
        document.documentElement.classList.add('no-scroll')
        setTimeout(() => emailInput.focus({ preventScroll: true }), 60)
      }

      function closeModal() {
        modal.dataset.open = 'false'
        modal.setAttribute('aria-hidden', 'true')
        document.documentElement.classList.remove('no-scroll')
        if (lastFocused) lastFocused.focus({ preventScroll: true })
      }

      const isOpen = () => modal.dataset.open === 'true'

      openBtn.addEventListener('click', openModal)

      // Fecha ao clicar no fundo ou em qualquer botão com data-close
      modal.addEventListener('click', (e) => {
        const t = e.target
        if (t.dataset && t.dataset.close !== undefined) return closeModal()
        if (t.closest('button[data-close]')) closeModal()
      })

      // Esc fecha; Tab fica preso dentro do modal
      document.addEventListener('keydown', (e) => {
        if (!isOpen()) return
        if (e.key === 'Escape') return closeModal()
        if (e.key !== 'Tab') return

        const items = [...card.querySelectorAll('a[href], button, input')].filter(
          (el) => !el.disabled && el.offsetParent !== null
        )
        if (!items.length) return
        const first = items[0]
        const last = items[items.length - 1]
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault()
          last.focus()
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault()
          first.focus()
        }
      })

      // Mostrar / ocultar senha
      toggleBtn.addEventListener('click', () => {
        const show = passwordInput.type === 'password'
        passwordInput.type = show ? 'text' : 'password'
        iconEye.classList.toggle('is-hidden', show)
        iconEyeOff.classList.toggle('is-hidden', !show)
        toggleBtn.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha')
      })

      // Envio do formulário
      form.addEventListener('submit', (e) => {
        e.preventDefault()
        if (!form.reportValidity()) return
        const data = Object.fromEntries(new FormData(form))
        console.log('Login enviado:', data)
        // TODO: enviar os dados para o seu back-end aqui
      })

      // Para abrir/fechar de qualquer outro lugar do seu site:
      window.LoginModal = { open: openModal, close: closeModal }
    })()
  </script>

  {% for message in messages %}
  <script>
      alert("{{message}}")
  </script>
  {% endfor %}

</body>
</html>
